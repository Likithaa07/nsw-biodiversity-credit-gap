# Runs the tests and the full pipeline on every push and pull request
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Run the whole pipeline
        run: python src/run_all.py
